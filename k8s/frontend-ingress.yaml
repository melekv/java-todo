apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-frontend
spec:
  ingressClassName: traefik
  rules:
    - host: todo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-frontend
                port:
                  number: 5173
