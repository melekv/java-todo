services:
  mysql:
    image: mysql:8.4
    container_name: spring-boot-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: todo
      MYSQL_USER: todo
      MYSQL_PASSWORD: todo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  frontend:
    image: node:26.7.0
    container_name: spring-boot-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./vue:/app
    command: npm run dev -- --host 0.0.0.0

  backend:
    image: todoapp:local
    container_name: spring-boot-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/todo
      DB_USERNAME: todo
      DB_PASSWORD: todo
      JWT_SECRET: your-very-long-secret-key-that-is-at-least-32-bytes-long
      JWT_EXPIRATION: 3600000
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql-data:
