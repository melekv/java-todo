backend:
  image:
    repository: todoapp
    tag: local

  replicas: 1

  database:
    url: jdbc:mysql://mysql:3306/todo
    username: todo

  jwtExpiration: "3600000"

secrets:
  jwtSecret: your-very-long-secret-key-that-is-at-least-32-bytes-long
  dbPassword: todo

frontend:
  image:
    repository: todo-frontend
    tag: local
  replicas: 1

mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.4"

  database: todo
  username: todo
  rootPassword: root
  storage: 1Gi

ingress:
  enabled: true
  className: traefik
  host: todo.local

imagePullSecrets:
  - name: ghcr0secret
